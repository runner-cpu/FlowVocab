name: Deploy FlowVocab to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python validation dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Lint source and release metadata
        run: npm run lint
      - name: Check release contract and PWA assets
        run: npm run check:release
      - name: Run Python asset tests
        run: npm run test:python
      - name: Build application
        run: npm run build
      - name: Run tests
        run: npm test -- --run
      - name: Typecheck
        run: npm run typecheck
      - name: Validate vocabulary content
        run: node scripts/validate-content.mjs
      - name: Check initial bundle
        run: npm run check:bundle
      - name: Check diff whitespace
        run: git diff --check
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
