name: Deploy FlowVocab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint source and release metadata
        run: npm run lint
      - name: Check release contract and PWA assets
        run: npm run check:release
      - name: Build application
        run: npm run build
      - name: Run tests
        run: npm test -- --run
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Validate vocabulary content
        run: node scripts/validate-content.mjs
      - name: Check initial bundle
        run: npm run check:bundle
      - name: Check diff whitespace
        run: git diff --check
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
